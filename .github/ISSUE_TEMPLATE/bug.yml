name: Bug
description: Something that doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What and why
      description: What happens, what should happen instead, and where (OS, terminal app, bash version, Claude Code version). Paste the status line output in a code block if it looks wrong.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: A short checklist that says when this is fixed, including a test that would have caught it.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: blast
    attributes:
      label: Blast radius
      description: Optional. Who is affected and how badly, and what a fix could touch (the status line render, hooks, users' config or state files).
  - type: input
    id: parent
    attributes:
      label: Parent
      description: Optional. The parent issue when this belongs to bigger work (e.g. #12); also add it as a sub-issue there.
