name: Feature
description: Something new (a state, outfit, add-on, companion, routine...) or a change to how something works
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What and why
      description: What should change, and why. Plain words; who it is for. For art, sketch it with single-width characters.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: A short checklist that says when this is finished, including its test.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: blast
    attributes:
      label: Blast radius
      description: Optional. What else this touches or could break (the status line render, hooks, users' config or state files).
  - type: input
    id: parent
    attributes:
      label: Parent
      description: Optional. The parent issue when this is one step of bigger work (e.g. #12); also add it as a sub-issue there.
