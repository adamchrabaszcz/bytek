name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Bytek must run on macOS's own bash 3.2, not a newer one from Homebrew.
      - name: Use the system bash 3.2 (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          ln -s /bin/bash "$RUNNER_TEMP/bin/bash"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Scripts parse
        run: |
          bash --version | head -1
          for f in bin/* tools/*.sh tests/*.sh; do bash -n "$f"; done
      - name: Tests
        run: tests/run.sh
      # Line coverage of the bash code, from the same tests run under kcov (Linux only).
      - name: Coverage (kcov)
        if: runner.os == 'Linux'
        run: |
          set -o pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq kcov
          kcov --version
          kcov --include-path="$PWD/bin,$PWD/tools" coverage tests/run.sh > /dev/null
          find coverage -maxdepth 2 | sort | head -40
          find coverage -name coverage.json | head -5 | xargs -I{} sh -c 'echo "== {}"; head -c 600 {}; echo'
          tools/coverage-summary.sh coverage/kcov-merged/coverage.json "$PWD/" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage to Codecov
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v5
        with:
          files: coverage/kcov-merged/cobertura.xml
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
