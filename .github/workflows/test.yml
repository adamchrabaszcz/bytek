name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Bytek must run on macOS's own bash 3.2, not a newer one from Homebrew.
      - name: Use the system bash 3.2 (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          ln -s /bin/bash "$RUNNER_TEMP/bin/bash"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Scripts parse
        run: |
          bash --version | head -1
          for f in bin/* tools/*.sh tests/*.sh; do bash -n "$f"; done
      - name: Tests
        run: tests/run.sh
      # Line coverage of the bash code, from the same tests run under kcov (Linux only).
      - name: Coverage (kcov)
        if: runner.os == 'Linux'
        run: |
          set -o pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq kcov
          kcov --include-path="$PWD/bin,$PWD/tools" coverage tests/run.sh > /dev/null
          tools/coverage-summary.sh coverage "$PWD/" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "COVERAGE_DIR=$(tools/coverage-summary.sh --report-dir coverage)" >> "$GITHUB_ENV"
      - name: Upload coverage to Codecov
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: ${{ env.COVERAGE_DIR }}/cobertura.xml
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
