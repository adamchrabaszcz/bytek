name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true # bats lives in tests/bats/
      # Bytek must run on macOS's own bash 3.2, not a newer one from Homebrew.
      - name: Use the system bash 3.2 (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          ln -s /bin/bash "$RUNNER_TEMP/bin/bash"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Scripts parse
        run: |
          bash --version | head -1
          for f in bin/* tools/*.sh tests/run.sh tests/helpers.bash install.sh uninstall.sh; do bash -n "$f"; done
      - name: Tests
        run: tests/run.sh

  # Line coverage of the bash code, in parallel with the tests: bashcov runs the same tests and
  # follows every bash script they start, including those behind bats' run (#59). Tracing makes
  # it much slower than the tests, so it gets its own job. Settings in .simplecov; the gems come
  # from Gemfile.lock, cached between runs by setup-ruby.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true # bats lives in tests/bats/
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Coverage (bashcov)
        run: |
          set -o pipefail
          # Tracing slows every render down; the test job checks the speed budget.
          BYTEK_SKIP_SPEED=1 bundle exec bashcov --root "$PWD" -- tests/run.sh
          # Every script must show coverage, so a measurement that silently stops fails the build.
          tools/coverage-summary.sh coverage --require bin/bytek tools/*.sh install.sh uninstall.sh | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/coverage.xml
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
