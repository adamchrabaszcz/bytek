name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true # bats lives in tests/bats/
      # Bytek must run on macOS's own bash 3.2, not a newer one from Homebrew.
      - name: Use the system bash 3.2 (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          ln -s /bin/bash "$RUNNER_TEMP/bin/bash"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Scripts parse
        run: |
          bash --version | head -1
          for f in bin/* tools/*.sh tests/run.sh tests/helpers.bash install.sh uninstall.sh; do bash -n "$f"; done
      - name: Tests
        run: tests/run.sh
      # Line coverage of the bash code: bashcov runs the same tests and follows every bash script
      # they start, including those behind bats' run (#59). Settings in .simplecov. Linux only.
      - name: Coverage (bashcov)
        if: runner.os == 'Linux'
        run: |
          set -o pipefail
          command -v gem >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ruby; }
          sudo gem install --no-document bashcov:4.0.3 simplecov:1.3.2 simplecov-cobertura:4.0.0
          # Tracing slows every render down; the Tests step above checks the speed budget.
          BYTEK_SKIP_SPEED=1 bashcov --root "$PWD" -- tests/run.sh
          # Every script must show coverage, so a measurement that silently stops fails the build.
          tools/coverage-summary.sh coverage --require bin/bytek tools/*.sh install.sh uninstall.sh | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage to Codecov
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: coverage/coverage.xml
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
