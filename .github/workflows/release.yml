name: release

# Once CI has passed on a push to main, this tags the commit and publishes a GitHub release
# if the merge shipped a change (tools/release.sh reads the Conventional Commits since the
# last tag), so what people install from the marketplace has a version and release notes.
on:
  workflow_run:
    workflows: [test]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          version=$(tools/release.sh)
          if [ -z "$version" ]; then echo "Nothing to release (docs, ci, chore… only)."; exit 0; fi
          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' "$SHA" 2>/dev/null || true)
          gh release create "v$version" --target "$SHA" --title "v$version" --generate-notes
          echo "Released v$version" >> "$GITHUB_STEP_SUMMARY"
          # The pull requests and issues it shipped get the milestone v$version and a comment.
          # The release is out already: a failure here only leaves the marks missing.
          tools/release-marks.sh "$version" "$previous" "$SHA" || echo "::warning::Could not mark the issues for v$version"
